<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>USDT • secure buy</title>
  <style>
    /* === base reset === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 10% 30%, #0b1c26, #0a1a22 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      margin: 0;
    }

    /* main card — glassmorphism refined */
    .container {
      width: 100%;
      max-width: 400px;
      background: rgba(18, 30, 38, 0.75);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 32px;
      padding: 24px 20px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(120, 180, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #fff;
      transition: all 0.2s ease;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #e0f2fe, #bae6fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1::before {
      content: "⚡";
      font-size: 28px;
      filter: drop-shadow(0 2px 4px gold);
      -webkit-text-fill-color: initial;
      color: #fbbf24;
    }

    /* card sections */
    .card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.2);
    }

    /* status chip + time */
    .status {
      text-align: center;
      font-weight: 600;
      padding: 12px 10px;
      border-radius: 60px;
      background: linear-gradient(145deg, #0f3b2c, #1e5940);
      color: #cbf7e1;
      font-size: 16px;
      letter-spacing: 0.3px;
      border: 1px solid rgba(72, 255, 180, 0.3);
      box-shadow: 0 6px 12px rgba(0, 40, 20, 0.6);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .status::before {
      content: "●";
      color: #4ade80;
      font-size: 22px;
      line-height: 0;
      text-shadow: 0 0 8px #00ff88;
    }

    .time {
      text-align: center;
      font-size: 14px;
      padding: 8px 10px;
      background: rgba(0, 20, 30, 0.5);
      border-radius: 40px;
      font-weight: 400;
      border: 1px dashed rgba(255, 215, 100, 0.4);
      color: #d4d4d8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(4px);
    }

    .time::before {
      content: "⏱️";
      font-size: 15px;
      filter: drop-shadow(0 0 4px gold);
    }

    /* labels */
    label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
      color: #aad3ff;
      letter-spacing: 0.2px;
      padding-left: 6px;
    }

    /* modern input */
    input {
      width: 100%;
      padding: 16px 18px;
      border-radius: 40px;
      border: none;
      background: rgba(10, 25, 35, 0.9);
      font-size: 18px;
      font-weight: 500;
      color: white;
      outline: 2px solid transparent;
      transition: 0.2s;
      border: 1px solid rgba(255, 215, 100, 0.15);
      box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.6);
    }

    input:focus {
      border-color: #fbbf24;
      outline: 2px solid rgba(255, 215, 0, 0.3);
      background: rgba(10, 30, 40, 1);
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 0.5;
    }

    /* result panel – elevated */
    .result {
      margin-top: 18px;
      background: linear-gradient(145deg, #0f212b, #0a1a22);
      padding: 18px 16px;
      border-radius: 22px;
      font-size: 16px;
      font-weight: 500;
      border: 1px solid #2f4b5c;
      box-shadow: inset 0 3px 8px #00000055, 0 10px 15px -10px black;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(5px);
      line-height: 1.7;
      color: #dfecf2;
    }

    .result span {
      font-weight: 700;
      color: #fcd34d;
    }

    /* CTA buttons */
    .btn {
      width: 100%;
      padding: 16px 14px;
      border: none;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      border: 1px solid rgba(255,255,240,0.1);
    }

    .buy {
      background: linear-gradient(135deg, #1f8b4c, #2db100);
      color: #f0fdf4;
      box-shadow: 0 14px 20px -8px rgba(0, 200, 80, 0.4);
      font-size: 20px;
      letter-spacing: 0.3px;
      border: 1px solid #a7f3ba;
    }

    .buy:hover {
      transform: scale(1.02) translateY(-2px);
      background: linear-gradient(135deg, #249f57, #34d101);
      box-shadow: 0 18px 24px -6px #1eaa4e;
    }

    .buy:active {
      transform: scale(0.99);
    }

    .support {
      background: #a9741e;
      background: linear-gradient(145deg, #b6560c, #9d4700);
      color: #ffeed9;
      box-shadow: 0 12px 18px -8px #b95e0b;
      border: 1px solid #fec78b;
    }

    .support:hover {
      background: #c45f0d;
      background: linear-gradient(145deg, #d2691a, #b75100);
      transform: translateY(-2px);
      box-shadow: 0 18px 22px -8px #d56810;
    }

    .footer {
      text-align: center;
      font-size: 13px;
      margin-top: 18px;
      color: #99b9cf;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-top: 1px dashed rgba(255, 195, 0, 0.2);
      padding-top: 16px;
    }

    .footer span {
      background: rgba(255, 255, 255, 0.02);
      padding: 4px 8px;
      border-radius: 30px;
      font-size: 12px;
    }

    /* bonus badge inside result */
    .result-bonus {
      color: #f6b83e;
      font-size: 17px;
      font-weight: 600;
    }

    /* tiny micro fix */
    .card:last-of-type {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>USDT Buy Portal</h1>

    <!-- status & time card -->
    <div class="card" style="padding-bottom: 8px;">
      <div class="status">BUY AVAILABLE 24/7</div>
      <div class="time">📦 Distribution Time: 7:00 AM – 12:00 PM</div>
    </div>

    <!-- amount + result card -->
    <div class="card">
      <label for="amount">Enter USDT amount</label>
      <input type="number" id="amount" value="50" min="10" step="1" inputmode="numeric">

      <!-- live result panel (updated via js) -->
      <div class="result" id="result">
        <span>💰 INR:</span> ₹0<br>
        <span>🎁 Bonus:</span> <span class="result-bonus">0 USDT</span>
      </div>
    </div>

    <!-- actions -->
    <button class="btn buy" id="buyBtn">💳 Buy USDT</button>
    <a class="btn support" href="https://wa.me/6285802886306" target="_blank" rel="noopener noreferrer">📞  Support (WhatsApp)</a>

    <div class="footer">
      <span>⚡ Fast Delivery</span>
      <span>🔒 Secure Trading</span>
      <span>⭐ Trusted</span>
    </div>
  </div>

  <script>
    (function() {
      // ----- constants (preserved exactly) -----
      const RATE = 100;

      // original bonus logic — unchanged
      function getBonus(usdt) {
        if (usdt >= 100) return 0.9;
        if (usdt >= 50) return 0.5;
        return 0;
      }

      // DOM elements
      const amountInput = document.getElementById('amount');
      const resultDiv = document.getElementById('result');
      const buyButton = document.getElementById('buyBtn');  // used for buy event

      // ----- update INR and bonus display -----
      function updateCalculation() {
        let usdt = parseFloat(amountInput.value) || 0;
        // avoid negative or weird values
        if (usdt < 0) usdt = 0;
        const inr = usdt * RATE;
        const bonus = getBonus(usdt);

        // format output exactly as before but more structured
        resultDiv.innerHTML = `
          <span>💰 INR:</span> ₹${inr.toFixed(2)}<br>
          <span>🎁 Bonus:</span> <span class="result-bonus">${bonus} USDT</span>
        `;
      }

      // attach event
      amountInput.addEventListener('input', updateCalculation);

      // initial update on page load
      updateCalculation();

      // ----- buy function (exact original logic) -----
      function buyUSDT() {
        let amt = amountInput.value;          // original used .value directly (string)
        let numericAmt = parseFloat(amt) || 0;
        let bonus = getBonus(numericAmt);      // bonus as number (0, 0.5, 0.9)

        // original message format: "Hello, I want to buy {amt} USDT.\nBonus: {bonus} USDT\nTotal INR: ₹{amt*RATE}"
        let msg = `Hello, I want to buy ${amt} USDT.\nBonus: ${bonus} USDT\nTotal INR: ₹${numericAmt * RATE}`;

        // open WhatsApp with the exact target
        window.open(`https://wa.me/6285802886306?text=${encodeURIComponent(msg)}`, '_blank');
      }

      // attach buy event to button (original inline onclick replaced with listener)
      buyButton.addEventListener('click', buyUSDT);

      // (optional) also attach to any future .buy clicks? but we have id.
      // ensure that support link remains unchanged (already in href)
    })();
  </script>

  <!-- note: all original values/behaviour preserved: rate 100, bonus tiers, wa number 6285802886306, distribution time, status -->
</body>
</html>
